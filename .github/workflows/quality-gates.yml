name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  backend-data-quality:
    name: Backend Data Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run mandatory data quality gates
        run: |
          pytest tests/test_data_validation.py tests/test_data_quality.py tests/test_data_hub.py tests/test_scada.py tests/test_real_data_reliability.py tests/test_epias_auth.py tests/test_data_contracts.py tests/test_feature_schema.py tests/test_model_validation.py tests/test_model_reliability.py tests/test_decision_reliability.py tests/test_recommendation_quality.py tests/test_drift_detection.py tests/test_alert_quality.py tests/test_confidence_stack.py tests/test_model_explainability.py tests/test_decision_causality.py tests/test_model_registry.py tests/test_observability.py tests/test_i18n.py

  frontend-quality:
    name: Frontend Build + Typecheck + Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
