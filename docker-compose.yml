services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: aerovantage-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - aerovantage-net
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: aerovantage-frontend
    ports:
      - "3000:3000"
    environment:
      API_BACKEND_URL: http://api:8000
      API_SECRET_KEY: ${API_SECRET_KEY:?Set API_SECRET_KEY in .env}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - aerovantage-net
    restart: unless-stopped

  # Legacy Streamlit UI — yalnızca ihtiyaç halinde:
  # docker compose --profile legacy up
  dashboard:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: aerovantage-dashboard
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000/api/v1/pipeline/trigger-pipeline
      API_SECRET_KEY: ${API_SECRET_KEY:?Set API_SECRET_KEY in .env}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - aerovantage-net
    restart: unless-stopped

networks:
  aerovantage-net:
    driver: bridge
